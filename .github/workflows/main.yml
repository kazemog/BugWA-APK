name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Overwrite Build Gradle
      run: |
        echo "buildscript {" > build.gradle
        echo "    repositories { google(); mavenCentral() }" >> build.gradle
        echo "    dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }" >> build.gradle
        echo "}" >> build.gradle
        echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
    - name: Setup Local Properties
      run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.5
    - name: Build APK
      run: gradle assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KazeBugAPK
        path: app/build/outputs/apk/debug/app-debug.apk
